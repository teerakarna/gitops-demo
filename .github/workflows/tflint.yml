name: tflint

on:
  pull_request:

permissions:
  contents: read

jobs:
  tflint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - terraform       # local kind path
          - terraform/gke   # cloud path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: latest
      - name: init
        working-directory: ${{ matrix.dir }}
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
      - name: lint
        working-directory: ${{ matrix.dir }}
        run: tflint --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact
