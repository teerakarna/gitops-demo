apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-demo-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    # Chart source: service-demo repo at main
    - repoURL: https://github.com/teerakarna/service-demo
      targetRevision: main
      path: chart/service-demo
      helm:
        valueFiles:
          - $gitops/values/dev/service-demo.yaml
    # Values source: gitops-demo repo (this repo)
    - repoURL: https://github.com/teerakarna/gitops-demo
      targetRevision: HEAD
      ref: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  # Manual sync: dev tracks releases (same v{X.Y.Z} as prod), promoted atomically
  # at release time. Auto-sync would race with the release commit.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
